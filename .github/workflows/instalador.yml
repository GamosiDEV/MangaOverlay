# Testa os instaladores numa máquina limpa (Windows e Ubuntu) e, numa tag v*, publica a release.
#
# Cada teste instala de verdade (PyTorch sem CUDA, porque as máquinas do GitHub não têm GPU), traduz uma página
# de mangá de teste com o motor offline e desinstala. No Windows, também abre o app e pede uma tradução da tela.

name: Instalador

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - install.sh
      - install.ps1
      - instalar-windows.cmd
      - installer/**
      - requirements.txt
      - constraints.txt
      - .github/workflows/instalador.yml

permissions:
  contents: read

concurrency:
  group: instalador-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Instalar (como com dois cliques em instalar-windows.cmd)
        shell: cmd
        env:
          MANGAOVERLAY_NO_PAUSE: "1"
        run: instalar-windows.cmd -Cpu -NoStart

      - name: Conferir atalhos e registro em Aplicativos
        shell: powershell
        run: |
          $prefix = Join-Path $env:LOCALAPPDATA 'Programs\MangaOverlay'
          $expected = @(
            (Join-Path $prefix '.venv\Scripts\pythonw.exe'),
            (Join-Path $prefix 'uninstall.ps1'),
            (Join-Path ([Environment]::GetFolderPath('Programs')) 'MangaOverlay.lnk'),
            (Join-Path ([Environment]::GetFolderPath('Desktop')) 'MangaOverlay.lnk'),
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MangaOverlay'
          )
          foreach ($path in $expected) {
            if (-not (Test-Path $path)) { throw "Faltando: $path" }
            Write-Host "ok: $path"
          }
          Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MangaOverlay' |
            Select-Object DisplayName, DisplayVersion, EstimatedSize, UninstallString | Format-List

      - name: Traduzir uma página de teste
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $prefix = Join-Path $env:LOCALAPPDATA 'Programs\MangaOverlay'
          & "$prefix\.venv\Scripts\python.exe" "$prefix\main.py" --image tests\fixtures\pagina-sintetica.png `
            --engine local --source ja --out traduzida.png > resultado.txt
          $code = $LASTEXITCODE
          Get-Content resultado.txt  # o > do PowerShell 5.1 grava em UTF-16
          if ($code -ne 0) { throw "Saiu com código $code" }
          $translations = @(Select-String -Path resultado.txt -Pattern '^\s+-> ')
          $empty = @($translations | Where-Object { $_.Line -match "->\s*''$" })
          if ($translations.Count -lt 3 -or $empty.Count -gt 0) {
            throw "Esperava ao menos 3 traduções não vazias; vieram $($translations.Count), $($empty.Count) vazias"
          }

      - name: Abrir o app e traduzir a tela
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $prefix = Join-Path $env:LOCALAPPDATA 'Programs\MangaOverlay'
          $log = Join-Path $env:LOCALAPPDATA 'MangaOverlay\Logs\mangaoverlay.log'
          # Mostra a página de teste na tela, para a captura ter o que traduzir
          Start-Process mspaint.exe (Resolve-Path tests\fixtures\pagina-sintetica.png)
          $app = Start-Process "$prefix\.venv\Scripts\pythonw.exe" -ArgumentList "`"$prefix\main.py`"" -WorkingDirectory $prefix -PassThru
          Start-Sleep -Seconds 45
          if ($app.HasExited) { Get-Content $log -ErrorAction SilentlyContinue; throw "O app fechou sozinho (código $($app.ExitCode))" }
          & "$prefix\.venv\Scripts\python.exe" "$prefix\main.py" --translate
          if ($LASTEXITCODE -ne 0) { throw 'Não conseguiu falar com o app pela IPC' }
          Start-Sleep -Seconds 40
          if ($app.HasExited) { Get-Content $log -ErrorAction SilentlyContinue; throw "O app fechou depois do atalho (código $($app.ExitCode))" }
          Write-Host '--- log do app ---'
          if (Test-Path $log) { Get-Content $log -Encoding UTF8 }
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'Traceback' -Quiet)) { throw 'Erro no log do app' }
          Stop-Process -Id $app.Id -Force

      - name: Desinstalar
        shell: powershell
        run: |
          $prefix = Join-Path $env:LOCALAPPDATA 'Programs\MangaOverlay'
          & "$prefix\uninstall.ps1" -Purge -Quiet
          foreach ($path in @($prefix, 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MangaOverlay',
                               (Join-Path ([Environment]::GetFolderPath('Programs')) 'MangaOverlay.lnk'))) {
            if (Test-Path $path) { throw "Sobrou: $path" }
          }

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Instalar
        run: ./install.sh --cpu --no-start

      - name: Traduzir uma página de teste
        run: |
          ~/.local/bin/mangaoverlay --image tests/fixtures/pagina-sintetica.png --engine local --source ja --out traduzida.png | tee resultado.txt
          total=$(grep -c '^ *-> ' resultado.txt || true)
          empty=$(grep -c "^ *-> ''$" resultado.txt || true)
          [ "$total" -ge 3 ] && [ "$empty" -eq 0 ] || { echo "Esperava ao menos 3 traduções não vazias ($total, $empty vazias)"; exit 1; }

      - name: Desinstalar
        run: |
          ~/.local/share/MangaOverlay/app/uninstall.sh --purge
          for path in ~/.local/share/MangaOverlay ~/.local/bin/mangaoverlay ~/.local/share/applications/mangaoverlay.desktop; do
            if [ -e "$path" ]; then echo "Sobrou: $path"; exit 1; fi
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Montar os pacotes
        run: |
          tag="${GITHUB_REF_NAME}"
          name="MangaOverlay-${tag}"
          git archive --format=zip --prefix="${name}/" -o "${name}-windows.zip" HEAD
          git archive --format=tar.gz --prefix="${name}/" -o "${name}-linux.tar.gz" HEAD

      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes=$(git tag -l --format='%(contents)' "$tag")
          gh release create "$tag" "MangaOverlay-${tag}-windows.zip" "MangaOverlay-${tag}-linux.tar.gz" \
            --title "MangaOverlay ${tag#v}" --notes "$notes"
