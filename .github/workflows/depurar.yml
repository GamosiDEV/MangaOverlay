name: Depurar crash no Windows

on:
  push:
    branches: [depurar-crash-windows]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variante: [so-ipc, atalho]
    steps:
      - uses: actions/checkout@v4

      - name: Instalar
        shell: cmd
        env:
          MANGAOVERLAY_NO_PAUSE: "1"
        run: instalar-windows.cmd -Cpu -NoStart -NoModels

      - name: Baixar os modelos usados
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $prefix = Join-Path $env:LOCALAPPDATA 'Programs\MangaOverlay'
          & "$prefix\.venv\Scripts\python.exe" "$prefix\main.py" --image tests\fixtures\pagina-sintetica.png --engine local --source ja --out x.png

      - name: Configurar a variante
        if: matrix.variante == 'sem-atalhos'
        shell: powershell
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'MangaOverlay'
          New-Item -ItemType Directory -Force $dir | Out-Null
          '{"hotkey_translate": "", "hotkey_colorize": "", "hotkey_hide": ""}' | Set-Content (Join-Path $dir 'config.json') -Encoding ASCII

      - name: Abrir o app várias vezes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $prefix = Join-Path $env:LOCALAPPDATA 'Programs\MangaOverlay'
          $log = Join-Path $env:LOCALAPPDATA 'MangaOverlay\Logs\mangaoverlay.log'
          Start-Process mspaint.exe (Resolve-Path tests\fixtures\pagina-sintetica.png)
          $crashes = 0
          foreach ($round in 1..3) {
            Remove-Item $log -ErrorAction SilentlyContinue
            $app = Start-Process "$prefix\.venv\Scripts\pythonw.exe" -ArgumentList "`"$prefix\main.py`"" -WorkingDirectory $prefix -PassThru
            Start-Sleep -Seconds 40
            foreach ($shot in 1..3) {
              if ($app.HasExited) { break }
              if ('${{ matrix.variante }}' -eq 'so-ipc') {
                foreach ($i in 1..4) { & "$prefix\.venv\Scripts\python.exe" "$prefix\main.py" --hide; Start-Sleep -Seconds 2 }
              } else {
                # Aperta Ctrl+Alt+M de verdade (pynput do próprio app), sem IPC
                & "$prefix\.venv\Scripts\python.exe" -c "import time; from pynput.keyboard import Controller, Key; k = Controller(); k.press(Key.ctrl); k.press(Key.alt); k.press('m'); time.sleep(0.1); k.release('m'); k.release(Key.alt); k.release(Key.ctrl)"
              }
              Start-Sleep -Seconds 30
            }
            Write-Host "=== rodada ${round} - saiu=$($app.HasExited) codigo=$(if ($app.HasExited) { '{0:X}' -f $app.ExitCode }) ==="
            if ($app.HasExited) { $crashes++ } else { Stop-Process -Id $app.Id -Force }
            if (Test-Path $log) { Get-Content $log -Encoding UTF8 | Select-String -NotMatch 'HF_TOKEN|pin_memory|super\(\).__init__|max_new_tokens' }
          }
          if ($crashes) { throw "$crashes rodada(s) com crash" }
